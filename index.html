<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Kế Toán Nhóm Pro 4.5 🌐</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca;
            --success: #10b981; --success-hover: #059669;
            --danger: #ef4444; --danger-hover: #dc2626;
            --gray-bg: #f8fafc; --border-color: #e2e8f0;
            --text-main: #0f172a; --text-muted: #64748b;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background: #f1f5f9; color: var(--text-main); padding: 16px; line-height: 1.5; }
        .container { max-width: 650px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); overflow: hidden; }
        
        #loginScreen { padding: 40px 24px; text-align: center; }
        .app-logo { font-size: 48px; margin-bottom: 12px; }
        h2 { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
        
        .app-header { background: var(--gray-bg); padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .user-badge { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
        .role-tag { background: #e0e7ff; color: var(--primary); padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
        
        .nav-tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 14px 8px; background: none; border: none; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; text-align: center; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: #fefefe; }

        .tab-content { padding: 20px; display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #334155; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 15px; background: #fff; }
        
        .member-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .member-card { display: flex; align-items: center; justify-content: space-between; background: var(--gray-bg); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
        .member-card input { max-width: 140px; text-align: right; font-weight: 600; border-color: #cbd5e1; }

        button.btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: #fff; color: var(--text-muted); border: 1px solid var(--border-color); }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        th { background: #f8fafc; font-weight: 600; color: #64748b; }

        .history-card { background: white; border: 1px solid var(--border-color); padding: 15px; border-radius: 12px; margin-bottom: 12px; position: relative; }
        .session-badge { padding: 2px 8px; font-size: 10px; font-weight: 700; border-radius: 4px; text-transform: uppercase; margin-right: 5px; }
        .badge-Sáng { background: #fef3c7; color: #d97706; }
        .badge-Trưa { background: #e0f2fe; color: #0284c7; }
        .badge-Tối { background: #f3e8ff; color: #7c3aed; }
        .history-meta { font-size: 13px; color: var(--primary); font-weight: 600; background: #f5f3ff; padding: 6px; border-radius: 6px; margin: 8px 0; }
        .history-body { font-size: 12px; color: #475569; background: #f8fafc; padding: 8px; border-radius: 6px; }
        .delete-btn { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px; }
        
        .mgmt-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-color); }
    </style>
</head>
<body>

    <div class="container">
        <!-- MÀN HÌNH ĐĂNG NHẬP -->
        <div id="loginScreen">
            <div class="app-logo">💸</div>
            <h2>Hệ Thống Kế Toán Nhóm</h2>
            <div class="form-group" style="text-align: left;">
                <label>Bạn là ai?</label>
                <select id="loginUser">
                    <option value="Admin">🔑 Ban Quản Trị (Admin)</option>
                </select>
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Mật khẩu (Admin: admin123 | User: user123)</label>
                <input type="password" id="loginPass" placeholder="Nhập mật khẩu...">
            </div>
            <button class="btn btn-primary" onclick="login()">Đăng Nhập Hệ Thống</button>
        </div>

        <!-- MÀN HÌNH CHÍNH -->
        <div id="mainScreen" style="display: none;">
            <div class="app-header">
                <div class="user-badge">👋 <span id="txtCurrentUser"></span> <span id="txtRole" class="role-tag"></span></div>
                <button class="btn btn-secondary" style="width: auto; padding: 6px 12px;" onclick="logout()">Thoát</button>
            </div>

            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('tab-record', this)">📝 Ghi Chép</button>
                <button class="tab-btn" onclick="switchTab('tab-summary', this)">📊 Chốt Sổ</button>
                <button class="tab-btn" onclick="switchTab('tab-history', this)">📜 Lịch Sử</button>
                <button class="tab-btn" id="nav-mgmt" style="display:none;" onclick="switchTab('tab-mgmt', this)">⚙️ Nhóm</button>
            </div>

            <!-- TAB GHI CHÉP -->
            <div id="tab-record" class="tab-content active">
                <div class="form-group">
                    <label>📍 Tên bữa ăn / Địa điểm:</label>
                    <input type="text" id="mealName" placeholder="Ví dụ: Ăn bún chả...">
                </div>
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1">
                        <label>🌅 Thời điểm:</label>
                        <select id="mealSession">
                            <option value="Sáng">Sáng</option>
                            <option value="Trưa">Trưa</option>
                            <option value="Tối">Tối</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:1">
                        <label>👤 Người trả tiền:</label>
                        <select id="mealPayer"></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>💰 Tổng hóa đơn (VNĐ):</label>
                    <input type="number" id="totalAmount" placeholder="Nhập tổng tiền...">
                </div>
                
                <label style="margin: 15px 0 10px; display: block; font-weight: 700;">🍽️ Tiền ăn riêng từng người:</label>
                <div id="memberInputs" class="member-grid"></div>
                
                <button class="btn btn-primary" onclick="addMeal()">💾 Lưu Dữ Liệu Lên Cloud</button>
            </div>

            <!-- TAB CHỐT SỔ -->
            <div id="tab-summary" class="tab-content">
                <h3 style="margin-bottom:15px;">📊 Bảng Bù Trừ Nợ</h3>
                <div id="summaryTable" style="overflow-x: auto;"></div>
                <button class="btn btn-primary" onclick="copySummary()" style="margin-top: 15px;">📋 Copy Báo Cáo Zalo</button>
                <div id="adminControls" style="display: none; margin-top: 10px;">
                    <button class="btn btn-danger" onclick="clearAllMeals()">🔄 Xóa Hết Dữ Liệu Tuần Cũ</button>
                </div>
            </div>

            <!-- TAB LỊCH SỬ -->
            <div id="tab-history" class="tab-content">
                <div id="mealList"></div>
            </div>

            <!-- TAB QUẢN LÝ NHÓM -->
            <div id="tab-mgmt" class="tab-content">
                <h3>Quản Lý Thành Viên</h3>
                <div class="form-group" style="display: flex; gap: 8px; margin-top:10px;">
                    <input type="text" id="newMemberName" placeholder="Tên thành viên mới...">
                    <button class="btn btn-primary" style="width: auto;" onclick="addNewMember()">Thêm</button>
                </div>
                <div id="memberManagementList"></div>
            </div>
        </div>
    </div>

    <script>
        // CẤU HÌNH FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAALXDSdZuUyDG9oXyB3s3sFMYKzlwibD8",
            authDomain: "apptinh-tiennhom.firebaseapp.com",
            projectId: "apptinh-tiennhom",
            storageBucket: "apptinh-tiennhom.firebasestorage.app",
            messagingSenderId: "692398650746",
            appId: "1:692398650746:web:322c8b98944f24d75bd2c3"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = "";
        let currentRole = ""; 
        let members = [];
        let meals = [];

        // 1. TẢI DANH SÁCH THÀNH VIÊN (REALTIME)
        function listenToMembers() {
            db.collection("members").orderBy("name", "asc").onSnapshot((snapshot) => {
                members = [];
                const selectLogin = document.getElementById('loginUser');
                const selectPayer = document.getElementById('mealPayer');
                
                // Reset select options
                let loginHtml = '<option value="Admin">🔑 Ban Quản Trị (Admin)</option>';
                let payerHtml = '';

                snapshot.forEach((doc) => {
                    let m = doc.data();
                    m.id = doc.id;
                    members.push(m);
                    loginHtml += `<option value="${m.name}">${m.name}</option>`;
                    payerHtml += `<option value="${m.name}">${m.name}</option>`;
                });
                
                selectLogin.innerHTML = loginHtml;
                selectPayer.innerHTML = payerHtml;

                // Nếu đang ở màn hình chính, cập nhật lại form nhập tiền
                if (currentUser) {
                    renderMemberInputs();
                    renderSummary();
                    renderMemberMgmt();
                }
            });
        }

        // 2. TẢI LỊCH SỬ HÓA ĐƠN (REALTIME)
        function listenToMeals() {
            db.collection("meals").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                meals = [];
                snapshot.forEach(doc => {
                    let data = doc.data(); data.id = doc.id;
                    meals.push(data);
                });
                renderSummary();
                renderHistory();
            });
        }

        // 3. ĐĂNG NHẬP
        function login() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            if (user === "Admin" && pass === "admin123") {
                currentRole = "admin"; currentUser = "Admin";
            } else if (user !== "Admin" && pass === "user123") {
                currentRole = "member"; currentUser = user;
            } else {
                alert("Sai mật khẩu!"); return;
            }

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
            document.getElementById('txtCurrentUser').innerText = currentUser;
            document.getElementById('txtRole').innerText = currentRole === "admin" ? "Chủ chi" : "Thành viên";
            
            if(currentRole === "admin") {
                document.getElementById('adminControls').style.display = 'block';
                document.getElementById('nav-mgmt').style.display = 'block';
            }
            
            renderMemberInputs();
            listenToMeals();
        }

        function logout() { location.reload(); }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // 4. HIỂN THỊ CÁC Ô NHẬP TIỀN THEO THÀNH VIÊN HIỆN CÓ
        function renderMemberInputs() {
            const container = document.getElementById('memberInputs');
            container.innerHTML = '';
            members.forEach(m => {
                container.innerHTML += `
                    <div class="member-card">
                        <label>👤 ${m.name}:</label>
                        <input type="number" class="member-amt" data-name="${m.name}" placeholder="0">
                    </div>`;
            });
        }

        // 5. THÊM BỮA ĂN LÊN CLOUD
        async function addMeal() {
            const name = document.getElementById('mealName').value.trim() || "Bữa ăn mới";
            const session = document.getElementById('mealSession').value;
            const payer = document.getElementById('mealPayer').value;
            const total = parseFloat(document.getElementById('totalAmount').value) || 0;
            
            if(total <= 0) { alert("Vui lòng nhập tổng tiền!"); return; }

            let amounts = {};
            document.querySelectorAll('.member-amt').forEach(input => {
                amounts[input.dataset.name] = parseFloat(input.value) || 0;
            });

            try {
                await db.collection("meals").add({
                    name, session, payer, totalAmount: total, 
                    amounts, creator: currentUser, createdAt: Date.now()
                });
                // Reset form
                document.getElementById('mealName').value = "";
                document.getElementById('totalAmount').value = "";
                document.querySelectorAll('.member-amt').forEach(i => i.value = "");
                alert("Đã lưu thành công!");
            } catch (e) { alert("Lỗi lưu dữ liệu: " + e.message); }
        }

        // 6. HIỂN THỊ BẢNG TỔNG KẾT
        function renderSummary() {
            let eaten = {}; let paid = {};
            members.forEach(m => { eaten[m.name] = 0; paid[m.name] = 0; });

            meals.forEach(meal => {
                if(paid[meal.payer] !== undefined) paid[meal.payer] += meal.totalAmount;
                Object.keys(meal.amounts).forEach(name => {
                    if(eaten[name] !== undefined) eaten[name] += meal.amounts[name];
                });
            });

            let html = `<table><thead><tr><th>Tên</th><th>Ăn (1)</th><th>Trả (2)</th><th>Cần đóng (1-2)</th></tr></thead><tbody>`;
            members.forEach(m => {
                let diff = eaten[m.name] - paid[m.name];
                let style = diff > 0 ? "color:red; font-weight:bold" : (diff < 0 ? "color:green; font-weight:bold" : "");
                let text = diff > 0 ? `+${diff.toLocaleString()}` : (diff < 0 ? `${diff.toLocaleString()}` : "0");
                
                html += `<tr>
                    <td>${m.name}</td>
                    <td>${eaten[m.name].toLocaleString()}</td>
                    <td>${paid[m.name].toLocaleString()}</td>
                    <td style="${style}">${text}</td>
                </tr>`;
            });
            html += `</tbody></table>`;
            document.getElementById('summaryTable').innerHTML = html;
        }

        // 7. HIỂN THỊ LỊCH SỬ
        function renderHistory() {
            const container = document.getElementById('mealList');
            container.innerHTML = meals.length === 0 ? '<p style="text-align:center; padding:20px; color:#94a3b8;">Chưa có dữ liệu.</p>' : '';
            
            meals.forEach(meal => {
                let detail = Object.entries(meal.amounts).filter(a => a[1] > 0).map(a => `${a[0]}:${a[1].toLocaleString()}`).join(', ');
                let delBtn = currentRole === 'admin' ? `<button class="delete-btn" onclick="deleteMeal('${meal.id}')">🗑️</button>` : '';
                
                container.innerHTML += `
                    <div class="history-card">
                        <span class="session-badge badge-${meal.session}">${meal.session}</span>
                        <strong>${meal.name}</strong>
                        <div class="history-meta">Tổng: ${meal.totalAmount.toLocaleString()}đ | Trả: ${meal.payer}</div>
                        <div class="history-body">Chi tiết: ${detail}</div>
                        ${delBtn}
                    </div>`;
            });
        }

        // 8. QUẢN LÝ THÀNH VIÊN
        function renderMemberMgmt() {
            const container = document.getElementById('memberManagementList');
            container.innerHTML = '';
            members.forEach(m => {
                container.innerHTML += `
                    <div class="mgmt-item">
                        <span>👤 ${m.name}</span>
                        <button class="btn btn-danger" style="width:auto; padding:4px 8px; font-size:12px;" onclick="deleteMember('${m.id}')">Xóa</button>
                    </div>`;
            });
        }

        async function addNewMember() {
            const name = document.getElementById('newMemberName').value.trim();
            if(!name) return;
            if(members.some(m => m.name === name)) { alert("Tên đã tồn tại!"); return; }
            await db.collection("members").add({ name });
            document.getElementById('newMemberName').value = "";
        }

        async function deleteMember(id) {
            if(confirm("Xóa thành viên này?")) await db.collection("members").doc(id).delete();
        }

        async function deleteMeal(id) {
            if(confirm("Xóa hóa đơn này?")) await db.collection("meals").doc(id).delete();
        }

        async function clearAllMeals() {
            if(confirm("Xóa SẠCH lịch sử tuần này?")) {
                const snapshot = await db.collection("meals").get();
                snapshot.forEach(doc => doc.ref.delete());
            }
        }

        function copySummary() {
            let text = "📋 TỔNG KẾT TIỀN ĂN:\n";
            document.querySelectorAll("#summaryTable tr").forEach((tr, i) => {
                if(i === 0) return;
                let tds = tr.querySelectorAll("td");
                text += `- ${tds[0].innerText}: ${tds[3].innerText} VNĐ\n`;
            });
            navigator.clipboard.writeText(text);
            alert("Đã copy!");
        }

        // KHỞI CHẠY
        listenToMembers();
    </script>
</body>
</html>
