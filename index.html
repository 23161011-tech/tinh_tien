<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Kế Toán Nhóm Pro 4.3 🌐</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #4f46e5; --primary-hover: #4338ca;
            --success: #10b981; --success-hover: #059669;
            --danger: #ef4444; --danger-hover: #dc2626;
            --gray-bg: #f8fafc; --border-color: #e2e8f0;
            --text-main: #0f172a; --text-muted: #64748b;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        body { background: #f1f5f9; color: var(--text-main); padding: 16px; line-height: 1.5; }
        .container { max-width: 650px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); overflow: hidden; }
        
        #loginScreen { padding: 40px 24px; text-align: center; }
        .app-logo { font-size: 48px; margin-bottom: 12px; }
        h2 { font-size: 24px; font-weight: 700; margin-bottom: 24px; }
        
        .app-header { background: var(--gray-bg); padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .user-badge { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
        .role-tag { background: #e0e7ff; color: var(--primary); padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
        
        .nav-tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 14px 8px; background: none; border: none; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; text-align: center; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background: #fefefe; }

        .tab-content { padding: 20px; display: none; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 16px; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #334155; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 15px; background: #fff; color: var(--text-main); }
        input:focus, select:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        .member-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .member-card { display: flex; align-items: center; justify-content: space-between; background: var(--gray-bg); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
        .member-card label { margin-bottom: 0; font-weight: 500; flex: 1; }
        .member-card input { max-width: 160px; text-align: right; font-weight: 600; }

        button.btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: #fff; color: var(--text-muted); border: 1px solid var(--border-color); }

        table { width: 100%; border-collapse: collapse; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { background: var(--gray-bg); font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }

        .history-card { background: white; border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; margin-bottom: 12px; position: relative; }
        .history-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .session-badge { padding: 2px 8px; font-size: 11px; font-weight: 700; border-radius: 6px; }
        .badge-Sáng { background: #fef3c7; color: #d97706; }
        .badge-Trưa { background: #e0f2fe; color: #0284c7; }
        .badge-Tối { background: #f3e8ff; color: #7c3aed; }
        .history-title { font-weight: 600; font-size: 16px; }
        .history-meta { font-size: 13px; color: var(--primary); font-weight: 600; margin-top: 4px; background: #f5f3ff; padding: 6px 10px; border-radius: 6px; display: inline-block;}
        .history-body { font-size: 13px; color: var(--text-muted); background: var(--gray-bg); padding: 8px 12px; border-radius: 6px; margin-top: 6px; }
        .delete-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--danger); cursor: pointer; }

        .mgmt-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border-color); }
        .loading { text-align: center; padding: 30px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <div id="loginScreen">
            <div class="app-logo">💸</div>
            <h2>Hệ Thống Kế Toán Nhóm</h2>
            <div class="form-group" style="text-align: left;">
                <label>Bạn là ai?</label>
                <select id="loginUser">
                    <option value="Admin">🔑 Ban Quản Trị (Admin)</option>
                </select>
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Mật khẩu xác thực</label>
                <input type="password" id="loginPass" placeholder="Admin: admin123 | Thành viên: user123">
            </div>
            <button class="btn btn-primary" onclick="login()">Đăng Nhập</button>
        </div>

        <div id="mainScreen" style="display: none;">
            <div class="app-header">
                <div class="user-badge">
                    👋 <span id="txtCurrentUser"></span>
                    <span id="txtRole" class="role-tag"></span>
                </div>
                <button class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 12px;" onclick="logout()">Đăng xuất</button>
            </div>

            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('tab-record')">📝 Ghi Chép</button>
                <button class="tab-btn" onclick="switchTab('tab-summary')">📊 Chốt Sổ</button>
                <button class="tab-btn" onclick="switchTab('tab-history')">📜 Lịch Sử</button>
                <button class="tab-btn" id="nav-mgmt" style="display:none;" onclick="switchTab('tab-mgmt')">⚙️ Nhóm</button>
            </div>

            <div id="tab-record" class="tab-content active">
                <div class="form-group">
                    <label>📍 Tên món ăn / Địa điểm:</label>
                    <input type="text" id="mealName" placeholder="Ví dụ: Bún đậu mắm tôm, lẩu nướng...">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>🌅 Thời điểm ăn:</label>
                        <select id="mealSession">
                            <option value="Sáng">Sáng 🌅</option>
                            <option value="Trưa">Trưa ☀️</option>
                            <option value="Tối">Tối 🌙</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>👤 Người đứng ra trả tiền:</label>
                        <select id="mealPayer">
                            </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>💰 Tổng số tiền chi trả cho bữa đó (VNĐ):</label>
                    <input type="number" id="totalAmount" placeholder="Nhập tổng hóa đơn bữa ăn...">
                </div>
                
                <label style="margin-top: 20px; margin-bottom: 10px; display: block; font-weight: 700;">🍽️ Số tiền ăn riêng của từng người:</label>
                <div id="memberInputs" class="member-grid"></div>
                
                <button class="btn btn-primary" onclick="addMeal()">💾 Lưu Lên Hệ Thống Cloud</button>
            </div>

            <div id="tab-summary" class="tab-content">
                <h3 style="font-size: 18px; margin-bottom: 12px;">Bảng Thống Kê Bù Trừ Nợ Tuần Này</h3>
                <div id="summaryTable"></div>
                <button class="btn btn-primary" onclick="copySummary()" style="margin-top: 20px;">📋 Copy Báo Cáo Gửi Zalo</button>
                <div id="adminControls" style="display: none; margin-top: 12px;">
                    <button class="btn btn-danger" onclick="clearAllData()">🔄 Xóa Sạch Dữ Liệu Tuần Mới</button>
                </div>
            </div>

            <div id="tab-history" class="tab-content">
                <div id="mealList"></div>
            </div>

            <div id="tab-mgmt" class="tab-content">
                <h3 style="font-size: 18px; margin-bottom: 12px;">Quản Lý Thành Viên Nhóm</h3>
                <div class="form-group" style="display: flex; gap: 8px;">
                    <input type="text" id="newMemberName" placeholder="Nhập tên thành viên mới...">
                    <button class="btn btn-primary" style="width: auto; white-space: nowrap;" onclick="addNewMember()">➕ Thêm</button>
                </div>
                <div id="memberManagementList" style="background: var(--gray-bg); border-radius: 8px;"></div>
            </div>
        </div>
    </div>

    <script>
        // --- ĐÃ LIÊN KẾT SẴN CẤU HÌNH FIREBASE CỦA BẠN ---
        const firebaseConfig = {
            apiKey: "AIzaSyAALXDSdZuUyDG9oXyB3s3sFMYKzlwibD8",
            authDomain: "apptinh-tiennhom.firebaseapp.com",
            projectId: "apptinh-tiennhom",
            storageBucket: "apptinh-tiennhom.firebasestorage.app",
            messagingSenderId: "692398650746",
            appId: "1:692398650746:web:322c8b98944f24d75bd2c3",
            measurementId: "G-10BR12FHYQ"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = "";
        let currentRole = ""; 
        let members = [];
        let meals = [];

        // Đồng bộ danh sách thành viên trực tuyến liên tục từ Firebase + Bẫy báo lỗi
        function listenToMembers() {
            db.collection("members").orderBy("name", "asc")
            .onSnapshot((snapshot) => {
                members = [];
                const selectLogin = document.getElementById('loginUser');
                const selectPayer = document.getElementById('mealPayer');
                
                selectLogin.innerHTML = '<option value="Admin">🔑 Ban Quản Trị (Admin)</option>';
                selectPayer.innerHTML = '';
                
                if(snapshot.empty) {
                    const defaultMembers = ["An", "Bình", "Cường", "Dũng", "Vy"];
                    defaultMembers.forEach(name => {
                        db.collection("members").add({ name }).catch(err => console.error("Lỗi tạo mẫu:", err));
                    });
                    return;
                }

                snapshot.forEach((doc) => {
                    let memberData = doc.data();
                    memberData.id = doc.id;
                    members.push(memberData);
                    
                    selectLogin.innerHTML += `<option value="${memberData.name}">${memberData.name}</option>`;
                    selectPayer.innerHTML += `<option value="${memberData.name}">${memberData.name}</option>`;
                });
                
                if (currentUser) {
                    initFormInputs();
                    renderSummaryAndHistory();
                    renderMemberManagement();
                }
            }, (error) => {
                alert("❌ Lỗi Firebase: Không thể tải danh sách thành viên. Vui lòng kiểm tra lại nút Publish trong tab Rules của Firebase. Chi tiết: " + error.message);
            });
        }

        function login() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            if (user === "Admin" && pass === "admin123") {
                currentRole = "admin"; currentUser = "Admin";
            } else if (user !== "Admin" && pass === "user123") {
                currentRole = "member"; currentUser = user;
            } else {
                alert("Mật khẩu xác thực chưa đúng!"); return;
            }

            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
            document.getElementById('txtCurrentUser').innerText = currentUser;
            document.getElementById('txtRole').innerText = currentRole === "admin" ? "Chủ chi" : "Thành viên";
            
            if(currentRole === "admin") {
                document.getElementById('adminControls').style.display = 'block';
                document.getElementById('nav-mgmt').style.display = 'block';
            }
            
            if(currentRole !== "admin") {
                document.getElementById('mealPayer').value = currentUser;
            }

            initFormInputs();
            listenToMeals();
        }

        function logout() {
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('mainScreen').style.display = 'none';
            document.getElementById('loginPass').value = "";
            document.getElementById('nav-mgmt').style.display = 'none';
            currentUser = ""; currentRole = "";
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function initFormInputs() {
            const inputsDiv = document.getElementById('memberInputs');
            inputsDiv.innerHTML = '';
            
            members.forEach(m => {
                const isAdmin = currentRole === "admin";
                const isSelf = m.name === currentUser;
                
                if (!isAdmin && !isSelf) return;
                
                inputsDiv.innerHTML += `
                    <div class="member-card">
                        <label>👤 Tiền ăn của ${m.name} ${isSelf ? '(Bạn)' : ''}:</label>
                        <input type="number" id="amt-${m.name}" placeholder="0đ">
                    </div>`;
            });
        }

        function listenToMeals() {
            db.collection("meals").orderBy("createdAt", "desc")
            .onSnapshot((snapshot) => {
                meals = [];
                snapshot.forEach(doc => {
                    let data = doc.data(); data.id = doc.id;
                    meals.push(data);
                });
                renderSummaryAndHistory();
            }, (error) => {
                alert("❌ Lỗi Firebase: Không thể tải lịch sử hóa đơn. Chi tiết: " + error.message);
            });
        }

        function addMeal() {
            const name = document.getElementById('mealName').value.trim() || `Bữa ăn ngày ${new Date().toLocaleDateString('vi-VN')}`;
            const session = document.getElementById('mealSession').value;
            const payer = document.getElementById('mealPayer').value;
            const totalAmount = parseFloat(document.getElementById('totalAmount').value) || 0;
            let amounts = {};
            let hasData = false;
            
            members.forEach(m => {
                const inputEl = document.getElementById(`amt-${m.name}`);
                const val = inputEl ? (parseFloat(inputEl.value) || 0) : 0;
                amounts[m.name] = val;
                if(val > 0) hasData = true;
            });

            if(totalAmount <= 0) { alert("Vui lòng nhập tổng số tiền chi trả hóa đơn!"); return; }
            if(!hasData) { alert("Vui lòng điền số tiền ăn cụ thể!"); return; }

            // Đẩy lên Firebase Cloud
            db.collection("meals").add({
                name, session, payer, totalAmount, amounts, creator: currentUser, createdAt: new Date().getTime()
            })
            .then(() => {
                // 🔥 Đã tối ưu xóa sạch hoàn toàn sau khi lưu thành công!
                document.getElementById('mealName').value = '';
                document.getElementById('totalAmount').value = '';
                members.forEach(m => {
                    const input = document.getElementById(`amt-${m.name}`);
                    if(input) input.value = '';
                });
                alert("🎉 Đã lưu hóa đơn lên đám mây thành công! Thanh nhập liệu đã được làm trống.");
            })
            .catch((error) => {
                alert("❌ KHÔNG THỂ LƯU DỮ LIỆU! Firebase từ chối ghi dữ liệu. Lý do: " + error.message);
            });
        }

        function deleteMeal(id) {
            if(confirm("Xóa lịch sử bữa ăn này khỏi hệ thống đám mây?")) {
                db.collection("meals").doc(id).delete().catch(err => alert("Lỗi xóa: " + err.message));
            }
        }

        function renderSummaryAndHistory() {
            let totalEaten = {};  
            let totalPaid = {};   
            
            members.forEach(m => {
                totalEaten[m.name] = 0;
                totalPaid[m.name] = 0;
            });

            meals.forEach(meal => {
                if (totalPaid[meal.payer] !== undefined) {
                    totalPaid[meal.payer] += (parseFloat(meal.totalAmount) || 0);
                }
                members.forEach(m => {
                    totalEaten[m.name] += (meal.amounts[m.name] || 0);
                });
            });

            let htmlTable = `<table>
                <thead>
                    <tr>
                        <th>Thành viên</th>
                        <th>Đã ăn (1)</th>
                        <th>Đã thanh toán (2)</th>
                        <th style="text-align:right;">Kết quả cần thu (1 - 2)</th>
                    </tr>
                </thead>
                <tbody>`;
                
            members.forEach(m => {
                let netBalance = totalEaten[m.name] - totalPaid[m.name];
                let balanceText = "";
                let balanceStyle = "";

                if (netBalance > 0) {
                    balanceText = `👉 Phải đóng: +${netBalance.toLocaleString('vi-VN')} đ`;
                    balanceStyle = "color: var(--danger); font-weight: 700;";
                } else if (netBalance < 0) {
                    balanceText = `🎉 Nhận lại: ${Math.abs(netBalance).toLocaleString('vi-VN')} đ`;
                    balanceStyle = "color: var(--success); font-weight: 700;";
                } else {
                    balanceText = "👌 Đã hoàn thành (0 đ)";
                    balanceStyle = "color: var(--text-muted);";
                }

                htmlTable += `<tr>
                    <td><strong>${m.name}</strong></td>
                    <td>${totalEaten[m.name].toLocaleString('vi-VN')} đ</td>
                    <td>${totalPaid[m.name].toLocaleString('vi-VN')} đ</td>
                    <td style="text-align:right; ${balanceStyle}">${balanceText}</td>
                </tr>`;
            });
            htmlTable += `</tbody></table>`;
            document.getElementById('summaryTable').innerHTML = htmlTable;

            const listDiv = document.getElementById('mealList');
            listDiv.innerHTML = '';
            if(meals.length === 0) {
                listDiv.innerHTML = '<div class="loading">Chưa có dữ liệu ăn uống tuần này trên Cloud.</div>';
                return;
            }

            meals.forEach(meal => {
                let details = Object.entries(meal.amounts)
                    .filter(([_, amt]) => amt > 0)
                    .map(([m, amt]) => `${m}: ${amt.toLocaleString('vi-VN')}đ`)
                    .join(' | ');
                
                let isAuthorizedToDelete = currentRole === 'admin';
                let deleteButton = isAuthorizedToDelete ? `<button class="delete-btn" onclick="deleteMeal('${meal.id}')">🗑️</button>` : '';

                listDiv.innerHTML += `
                    <div class="history-card">
                        <div class="history-header">
                            <span class="session-badge badge-${meal.session}">${meal.session}</span>
                            <span class="history-title">${meal.name}</span>
                        </div>
                        <div class="history-meta">
                            💰 Tổng bill: ${(meal.totalAmount || 0).toLocaleString('vi-VN')}đ | 💳 Người chi: ${meal.payer}
                        </div>
                        <div class="history-body"><strong>Chi tiết suất ăn:</strong><br>${details}</div>
                        <div class="history-footer">Ghi chép bởi: ${meal.creator}</div>
                        ${deleteButton}
                    </div>`;
            });
        }

        function renderMemberManagement() {
            const container = document.getElementById('memberManagementList');
            container.innerHTML = '';
            members.forEach(m => {
                container.innerHTML += `
                    <div class="mgmt-item">
                        <span style="font-weight:500;">👤 ${m.name}</span>
                        <button class="btn btn-danger" style="width:auto; padding:4px 8px; font-size:12px;" onclick="deleteMember('${m.id}')">Xóa khỏi nhóm</button>
                    </div>`;
            });
        }

        function addNewMember() {
            const nameInput = document.getElementById('newMemberName');
            const name = nameInput.value.trim();
            if(!name) return;
            
            if(members.some(m => m.name.toLowerCase() === name.toLowerCase())) {
                alert("Thành viên này đã tồn tại!"); return;
            }

            db.collection("members").add({ name })
            .then(() => {
                nameInput.value = '';
                alert("🎉 Đã thêm và đồng bộ thành viên mới lên Cloud thành công!");
            })
            .catch(error => {
                alert("❌ Không thể thêm thành viên! Lỗi Firebase: " + error.message);
            });
        }

        function deleteMember(id) {
            if(confirm("Xóa thành viên này khỏi hệ thống đám mây?")) {
                db.collection("members").doc(id).delete().catch(err => alert("Lỗi xóa: " + err.message));
            }
        }

        function copySummary() {
            let totalEaten = {}; let totalPaid = {};
            members.forEach(m => { totalEaten[m.name] = 0; totalPaid[m.name] = 0; });
            meals.forEach(meal => {
                if (totalPaid[meal.payer] !== undefined) totalPaid[meal.payer] += (parseFloat(meal.totalAmount) || 0);
                members.forEach(m => { totalEaten[m.name] += (meal.amounts[m.name] || 0); });
            });

            let text = "📋 TỔNG KẾT TIỀN ĐI ĂN TUẦN NÀY (BÙ TRỪ NỢ):\n";
            members.forEach(m => {
                let netBalance = totalEaten[m.name] - totalPaid[m.name];
                if (netBalance > 0) {
                    text += `- ${m.name}: Phải đóng thêm +${netBalance.toLocaleString('vi-VN')} đ\n`;
                } else if (netBalance < 0) {
                    text += `- ${m.name}: Nhận lại tiền dư ${Math.abs(netBalance).toLocaleString('vi-VN')} đ\n`;
                } else {
                    text += `- ${m.name}: Đã xong xuôi (0 đ)\n`;
                }
            });
            text += "\nMọi người check lịch sử chi tiết trên App và thanh toán bù trừ nhé! Thân ái 🥰";
            
            navigator.clipboard.writeText(text).then(() => alert("Đã copy báo cáo!"));
        }

        function clearAllData() {
            if(confirm("Hành động này sẽ XÓA SẠCH toàn bộ lịch sử hóa đơn tuần này trên Cloud. Bạn chắc chắn chứ?")) {
                db.collection("meals").get().then((snapshot) => {
                    snapshot.forEach(doc => doc.ref.delete());
                    alert("Đã làm sạch dữ liệu tuần cũ!");
                }).catch(err => alert("Lỗi xóa hết: " + err.message));
            }
        }

        listenToMembers();
    </script>
</body>
</html>
